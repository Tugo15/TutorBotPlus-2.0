name: CI/CD Pipeline - TutorBotPlus 2.0

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: tutorbotplus_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v3

      - name: Configurar Entorno PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, pdo, pdo_mysql, bcmath, ctype, json, openssl, tokenizer, xml
          coverage: none

      - name: Cache de Dependencias de Composer
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Instalar Dependencias PHP (Composer)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Configurar Archivo de Entorno de Pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar Pruebas Automatizadas (PHPUnit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tutorbotplus_test
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: vendor/bin/phpunit
